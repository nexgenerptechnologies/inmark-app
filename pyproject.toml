[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "inmark_app"
authors = [
    { name = "Inmark Exports", email = "varun@inmark.co.in"}
]
description = "Custom app for Inmark Exports"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.flit.module]
name = "inmark_app"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
